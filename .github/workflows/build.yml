#
# The suite, on a machine nobody owns.
#
# WHY THIS EXISTS. 54% of this project's enforcement is a test or a release-phase
# check, and until this file landed every one of it ran only when somebody
# remembered to run it locally. For a public repository that makes those
# mechanisms invisible: a contributor's pull request could break any of them and
# nothing would say so.
#
# WHAT IT COSTS, stated here rather than left to be discovered. The browser cache
# is cold on every run, so the CDN is asked for the full first-run download:
# Chromium 202,283,919 B + ffmpeg 1,411,741 B + winldd 128,684 B = 203,824,344 B,
# about 204 MB, and Firefox adds a further ~125.7 MB. Nothing here caches them.
# That is deliberate: a cache key would have to be computed from a browsers.json
# this build has not resolved yet, and a key guessed ahead of the resolve is a pin
# wearing a cache's clothes -- which is the one thing this project's versioning
# policy forbids. See kb/playwright/provisioning-and-timings.md for both figures
# and how to re-establish them.
#
# WHY IT MIGHT BE RED WITHOUT ANYONE BREAKING ANYTHING. Every dependency floats to
# latest at build time. If upstream moved and nobody has reviewed it,
# UpstreamReviewTests goes red on purpose -- that is the marker gate, and it means
# a review is owed, not that a file is stale. DO NOT EDIT upstream-review.json to
# turn this green. Read UPSTREAM-REVIEW.md and follow it.
#
# WHAT THIS RUN DOES NOT COVER, and it says so in its own output. The suite skips
# loudly rather than silently when a capability is absent: this job provisions the
# payload, Chromium and Firefox and publishes the NativeAOT binary, so those four
# capabilities are PRESENT. `packed release` and `client CLI` are ABSENT here --
# the first needs a Velopack pack and the second needs a real MCP client installed
# on the machine. BROWSERAI_RELEASE_RUN is therefore deliberately NOT set: it turns
# an absent capability from a skip into a failure, and it belongs to the release
# gate that build/New-Release.ps1 drives. The suite prints a coverage block naming
# every capability and its state, and this job puts that block in the job summary.
#
# ⚠️ AND THE PARAGRAPH ABOVE IS NOW ENFORCED RATHER THAN CLAIMED. Until 2026-08-19
# it was prose: nothing anywhere pinned WHICH capabilities this job expects to
# lack, so a fifth quietly going absent -- a provisioning step that started failing
# soft, a runner image that dropped something -- looked exactly like the two that
# are absent by design. Green run, one more ABSENT line in a block nobody diffs.
# BROWSERAI_EXPECTED_ABSENT on the test step below is that declaration, and
# SuiteCoverageTests.EveryAbsentCapabilityIsOneThisRunsEnvironmentDeclared fails
# the build on any absence it does not name -- and on any name in it that turns out
# to be present, so the declaration cannot rot into standing permission. It is set
# HERE and nowhere else: a developer machine declares nothing and behaves exactly
# as it did before, because what is provisioned on somebody's laptop is a fact
# about their disk rather than about this repository.

name: build

on:
  # Both, unscoped. A branch pushed inside this repository and then opened as a
  # pull request therefore builds twice, at ~330 MB of CDN traffic each: that is a
  # known cost, written down here rather than discovered on a bill. Scoping `push`
  # to master halves it and costs a contributor their pre-PR feedback; it is a
  # trade for whoever owns the repository to make, not a default to drift into.
  push:
  pull_request:

# Read-only. Nothing here publishes, tags or comments.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Windows-only by charter, not by convenience: the product is a Win32 job
    # object, a message-window walk and a NativeAOT win-x64 publish.
    runs-on: windows-latest

    # SaturationTests alone is 80-96 s on a developer machine and runs
    # [NotInParallel] beside nothing else; the payload build downloads ~330 MB and
    # the AOT publish costs about a minute of ILC. This is a ceiling that catches a
    # hang, not a promptness assertion -- the suite has none of those left.
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        # Resolved 2026-08-18 to v7.0.1. The major tag floats within v7, which is
        # this project's versioning policy applied to its own CI.
        uses: actions/checkout@v7
        with:
          # THE WHOLE HISTORY, FOR THE TAGS. MinVer derives the version by
          # counting from the nearest `v*` tag, and a shallow clone carries no
          # tags at all -- so the default depth-1 checkout produces
          # `0.0.0-alpha.0`, which BrowserAI.csproj REFUSES rather than stamps.
          # Measured on this workflow's first run, 2026-08-18: the publish
          # failed exactly there, and the build's own error named this fix.
          # A binary that does not know what it is cannot be rolled back to or
          # bisected against, which is why the refusal exists and why the cost
          # of a full clone is the right trade.
          fetch-depth: 0

      - name: Install the SDK named by global.json
        # Resolved 2026-08-18 to v6.0.0.
        uses: actions/setup-dotnet@v6
        with:
          # global.json carries a FLOOR with rollForward=latestMajor, so this
          # takes the newest SDK the runner offers and fails loudly on one that is
          # behind. Never a pin.
          global-json-file: global.json

      - name: Report what the runner actually is
        # Recorded rather than assumed. Every [MACHINE] fact in kb/ was measured on
        # one developer machine, and a CI failure that turns out to be a core count
        # should say so in its own log rather than after an afternoon.
        run: |
          dotnet --info
          Write-Host "processors: $env:NUMBER_OF_PROCESSORS"
          Write-Host "workspace:  $PWD"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, TotalVisibleMemorySize, FreePhysicalMemory |
            Format-List

      - name: Build the payload, and provision Chromium for the rig
        # Build-order step 3 (ARCHITECTURE.md). Node and the @playwright/mcp tree
        # are re-resolved from nothing -- node_modules and package-lock.json are
        # deleted first -- so nothing here can be held back by a stale lock. The
        # browser half is upstream's own installer, run once, so that the tests
        # after this have a real browser rather than a mock. ~204 MB from the CDN.
        run: pwsh -File build/Build-Payload.ps1

      - name: Provision Firefox for the rig
        # ~125.7 MB more, and it is the difference between FirefoxTests running and
        # FirefoxTests announcing that it did not. Upstream's own installer again,
        # the same CLI Build-Payload.ps1 uses, into the same browsers root.
        # Deleting this step is a supported choice: the suite then skips those
        # tests LOUDLY and the coverage block below says Firefox ABSENT.
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:LOCALAPPDATA 'BrowserAI' 'browsers'
          & payload/node/node.exe payload/mcp/node_modules/@playwright/mcp/cli.js install-browser firefox --no-progress
          if ($LASTEXITCODE -ne 0) { throw "install-browser firefox exited $LASTEXITCODE" }

      - name: Restore - resolve the float, then verify what it resolved
        # TWO STEPS, AND THEY ARE MUTUALLY EXCLUSIVE IN ONE INVOCATION. With a lock
        # file present and no --force-evaluate, NuGet does not re-resolve and the
        # float is silently dead (NU1512). A one-step locked restore passes while
        # resolving nothing. Both commands are DECISIONS.md's, verbatim; neither
        # was invented here.
        run: |
          dotnet restore --force-evaluate
          dotnet restore --locked-mode

      - name: Report lock-file drift, and do not fail on it
        # Drift is information, not a gate -- CLAUDE.md is explicit about that, and
        # a build that went red because upstream published would block every
        # unrelated change. What must not happen is silence: a bare `git diff`
        # prints nothing whether it found nothing or was never run, so the exit
        # code is captured and reported either way. The gate for adopting a moved
        # version is the review, and UpstreamReviewTests enforces that below.
        run: |
          $diff = git diff --stat -- "**/packages.lock.json" build/payload/package-lock.json
          if ($diff) {
            "## Lock files moved during the resolve", '', '```', $diff, '```', '',
            'This is drift, not a failure. Adopting it needs UPSTREAM-REVIEW.md.' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host $diff
          } else {
            Write-Host "No lock file moved: the resolve matched what is committed."
          }

      - name: Publish the NativeAOT binary
        # Required, not optional: the vertical slice and the saturation test drive
        # THIS binary rather than dotnet run, because PROC_THREAD_ATTRIBUTE_JOB_LIST
        # under [LibraryImport] and the SDK's serialization under ILC behave
        # identically under the JIT and can only fail after native compilation.
        # PublishedSlice refuses a stale publish rather than testing one.
        run: dotnet publish src/BrowserAI/BrowserAI.csproj -c Release -r win-x64 --self-contained

      - name: Run the whole suite
        # Everything, including SaturationTests. A CI that skipped the expensive
        # half would recreate the gap it exists to close.
        #
        # No --treenode-filter and no parallelism switch. The suite runs unbounded
        # by assembly attribute and that is a RACE DETECTOR as much as a speed
        # choice -- SuiteParallelism.cs carries the maintainer's ruling verbatim.
        # DO NOT cap it here to make a red run green.
        env:
          # WHAT THIS JOB EXPECTS TO LACK, declared rather than described. See the
          # header. Comma-separated SuiteCapability names; the literal `none`
          # declares that everything is expected PRESENT, and an unset variable
          # declares nothing at all, which is what a developer machine does.
          #
          # ⚠️ Adding to this list WIDENS what may silently be missing. Do not add
          # a capability to make a red build green: a name here is a promise that
          # nobody minds that capability being gone, and the two below are the two
          # this project has decided not to build on a hosted runner -- a Velopack
          # pack, and a real MCP client installed on the machine.
          BROWSERAI_EXPECTED_ABSENT: PackagedRelease,ClientCommandLine
        run: dotnet test

      - name: Put the coverage block in the job summary
        if: always()
        # The block is the only thing in a run's output that tells a degraded run
        # from a real one before the skipped count moves, so it goes where a reader
        # will actually see it.
        run: |
          $report = '.work/suite-coverage.txt'
          if (Test-Path $report) {
            "## Suite coverage", '', '```', (Get-Content $report -Raw), '```' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## Suite coverage", '', "No coverage report at $report -- the session-end hook did not run, which itself is worth looking at." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Keep the run's own reports
        if: always()
        # Resolved 2026-08-18 to v7.0.1.
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/
            .work/suite-coverage.txt
          if-no-files-found: warn
