<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrowserAI</title>
<!-- Direction C, Live map: who uses BrowserAI and which browser each one opened, drawn as lines. Mockup with invented data. -->
<style>
/* The mockup's own control, bottom right: not part of any design. */
.mock-control { position: fixed; right: 12px; bottom: 12px; z-index: 9999; display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; max-width: 620px; padding: 8px 10px; border-radius: 10px; background: rgba(17, 20, 19, 0.9); color: #eef2f0; font: 12px/1.3 "Segoe UI", system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.mock-control strong { margin-right: 4px; color: #fde68a; }
.mock-control span { margin-left: 6px; opacity: 0.7; }
.mock-control a { color: #d6e4ff; text-decoration: none; padding: 2px 7px; border-radius: 6px; }
.mock-control a:hover { background: rgba(255, 255, 255, 0.12); }
.mock-control a[aria-current] { background: #34d399; color: #052e22; }

:root {
  color-scheme: dark;
  --bg: #0a1316;
  --grid: rgba(120, 190, 200, 0.06);
  --panel: #0f1c20;
  --panel-2: #13242a;
  --line: #1f343b;
  --line-2: #2a4650;
  --text: #e3eef0;
  --muted: #8fa9ae;
  --faint: #5f7a80;
  --accent: #34d399;
  --accent-2: #22b8cf;
  --accent-ink: #052a20;
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.12);
  --bad: #fb7185;
  --bad-soft: rgba(251, 113, 133, 0.12);
  --hidden: #34d399;
  --hidden-soft: rgba(52, 211, 153, 0.12);
  --closed: #6b8288;
  --wire: rgba(143, 169, 174, 0.35);
  --hub-a: #10b981;
  --hub-b: #0e7490;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f6f7;
  --grid: rgba(14, 116, 144, 0.07);
  --panel: #ffffff;
  --panel-2: #f5f9fa;
  --line: #dce7ea;
  --line-2: #c7d7dc;
  --text: #102226;
  --muted: #557075;
  --faint: #8aa2a7;
  --accent: #0b8a5f;
  --accent-2: #0e7490;
  --accent-ink: #ffffff;
  --warn: #b45309;
  --warn-soft: rgba(245, 158, 11, 0.14);
  --bad: #be123c;
  --bad-soft: rgba(225, 29, 72, 0.1);
  --hidden: #0b8a5f;
  --hidden-soft: rgba(16, 185, 129, 0.12);
  --closed: #8aa2a7;
  --wire: rgba(85, 112, 117, 0.35);
  --shadow: 0 8px 24px rgba(16, 34, 38, 0.08);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f2f6f7;
    --grid: rgba(14, 116, 144, 0.07);
    --panel: #ffffff;
    --panel-2: #f5f9fa;
    --line: #dce7ea;
    --line-2: #c7d7dc;
    --text: #102226;
    --muted: #557075;
    --faint: #8aa2a7;
    --accent: #0b8a5f;
    --accent-2: #0e7490;
    --accent-ink: #ffffff;
    --warn: #b45309;
    --warn-soft: rgba(245, 158, 11, 0.14);
    --bad: #be123c;
    --bad-soft: rgba(225, 29, 72, 0.1);
    --hidden: #0b8a5f;
    --hidden-soft: rgba(16, 185, 129, 0.12);
    --closed: #8aa2a7;
    --wire: rgba(85, 112, 117, 0.35);
    --shadow: 0 8px 24px rgba(16, 34, 38, 0.08);
  }
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--text); background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.icon { width: 16px; height: 16px; flex: none; }
.brand-mark { width: 28px; height: 28px; flex: none; }
code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar with tabs */
.bar { display: flex; align-items: center; gap: 22px; padding: 0 28px; height: 60px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; color: var(--text); text-decoration: none; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tabs a { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 550; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .icon { width: 16px; height: 16px; }
.tabs .dotn { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.bar-gap { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.led.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.led.bad { background: var(--bad); box-shadow: 0 0 10px var(--bad); }

main { padding: 24px 28px 48px; max-width: 1440px; margin: 0 auto; }
.intro { display: flex; align-items: flex-end; gap: 24px; margin: 0 0 18px; }
.intro h1 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 26px; font-weight: 650; margin: 0; letter-spacing: -0.015em; }
.intro p { margin: 4px 0 0; color: var(--muted); max-width: 760px; }
.legend { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; justify-content: flex-end; }
.legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend i { width: 22px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.w { border-color: var(--warn); }
.legend i.h { border-color: var(--hidden); }
.legend i.c { border-color: var(--closed); border-top-style: dashed; }
.legend i.k { border-color: var(--faint); border-top-style: dotted; }

/* Alerts */
.alerts { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
.alert { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); }
.alert .icon { width: 20px; height: 20px; }
.alert.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-soft); }
.alert.bad > .icon, .alert.bad b { color: var(--bad); }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.alert.warn > .icon, .alert.warn b { color: var(--warn); }
.alert.good > .icon, .alert.good b { color: var(--accent); }
.alert p { margin: 0; flex: 1; }

/* The map */
.map { position: relative; display: grid; grid-template-columns: minmax(280px, 360px) minmax(40px, 1fr) 230px minmax(40px, 1fr) minmax(260px, 350px); column-gap: 0; row-gap: 14px; padding: 22px 22px 26px; border: 1px solid var(--line); border-radius: 20px; background: color-mix(in srgb, var(--panel) 55%, transparent); }
.col-head { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 650; padding: 0 2px 2px; }
.col-head.right { text-align: left; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke-width: 2; stroke: var(--wire); }
.wire.w { stroke: var(--warn); }
.wire.h { stroke: var(--hidden); }
.wire.c { stroke: var(--closed); stroke-dasharray: 5 5; }
.wire.k { stroke: var(--faint); stroke-dasharray: 2 5; }
.wire.live { stroke-width: 2.6; stroke-dasharray: 16 4; animation: flow 0.9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) { .wire.live { animation: none; } }
.port { stroke: var(--bg); stroke-width: 3; }
.port.w { fill: var(--warn); }
.port.h { fill: var(--hidden); }
.port.c { fill: var(--closed); }
.port.k, .port.n { fill: var(--faint); }

.node { position: relative; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--panel); box-shadow: var(--shadow); text-align: left; color: inherit; font: inherit; cursor: pointer; width: 100%; }
.node:hover { border-color: var(--accent); }
.node[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent), var(--shadow); }
.node .txt { flex: 1; min-width: 0; }
.node b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.node small { display: block; font-size: 12px; color: var(--muted); }
.node .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.node .tag.live { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.app-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 750; font-size: 11px; color: #fff; flex: none; }
.app-ic.cc { background: linear-gradient(135deg, #8b6cf0, #5a3fc0); }
.app-ic.cx { background: linear-gradient(135deg, #4b93db, #2b62a3); }
.left-cell { grid-column: 1; display: flex; flex-direction: column; gap: 6px; align-self: center; }
.group-label { font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 6px; margin: 2px 0 0 4px; }
.group-label .icon { width: 13px; height: 13px; }
.ghost { grid-column: 1; align-self: center; border: 1px dashed var(--line-2); border-radius: 14px; padding: 12px 14px; color: var(--faint); font-size: 12.5px; }
.right-cell { grid-column: 5; align-self: center; display: flex; flex-direction: column; gap: 8px; }
.none-cell { grid-column: 5; align-self: center; color: var(--faint); font-size: 12.5px; padding-left: 4px; }

.br-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.br-ic .icon { width: 18px; height: 18px; }
.br-ic.w { background: var(--warn-soft); color: var(--warn); }
.br-ic.h { background: var(--hidden-soft); color: var(--hidden); }
.br-ic.c { background: var(--panel-2); color: var(--closed); }
.node.w { border-color: color-mix(in srgb, var(--warn) 55%, var(--line-2)); }
.node .state { font-size: 12px; font-weight: 600; }
.node.w .state { color: var(--warn); }
.node.h .state { color: var(--hidden); }
.node.c .state { color: var(--closed); }
.count { font-variant-numeric: tabular-nums; }

/* The hub */
.hub { grid-column: 3; position: relative; z-index: 1; border-radius: 22px; padding: 20px 18px; background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--hub-a) 35%, var(--panel)) 0%, var(--panel) 70%); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line-2)); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 7%, transparent), var(--shadow); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; cursor: pointer; color: inherit; font: inherit; }
.hub .brand-mark { width: 54px; height: 54px; filter: drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 55%, transparent)); }
.hub h2 { margin: 6px 0 0; font-size: 17px; }
.hub p { margin: 0; color: var(--muted); font-size: 12.5px; }
.hub .hub-stat { margin-top: 10px; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.hub .hub-stat div { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 10px; border-radius: 10px; background: color-mix(in srgb, var(--panel-2) 80%, transparent); }
.hub .hub-stat div span:first-child { color: var(--muted); }
.hub .upd { margin-top: auto; width: 100%; border-radius: 12px; padding: 10px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.hub .upd b { display: block; font-size: 14px; }
.hub .upd.ok { background: var(--hidden-soft); color: var(--hidden); border-color: color-mix(in srgb, var(--hidden) 35%, transparent); }

.below { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.mini { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); text-decoration: none; color: inherit; }
.mini:hover { border-color: var(--accent); }
.mini .icon { width: 22px; height: 22px; color: var(--accent); }
.mini b { display: block; }
.mini span { color: var(--muted); font-size: 12.5px; }
.mini .chev { margin-left: auto; width: 16px; height: 16px; color: var(--faint); }

/* The inspector drawer */
.drawer { position: fixed; top: 60px; right: 0; bottom: 0; width: 420px; z-index: 30; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: -20px 0 40px rgba(0, 0, 0, 0.35); padding: 22px 24px; overflow: auto; transform: translateX(100%); transition: transform 0.18s ease-out; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer h2 { margin: 6px 0 4px; font-size: 20px; }
.drawer .kind { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 650; display: flex; align-items: center; gap: 6px; }
.drawer .close { position: absolute; right: 16px; top: 16px; background: transparent; border: 1px solid var(--line-2); color: var(--muted); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; }
.drawer .what { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); color: var(--muted); font-size: 13px; display: flex; gap: 10px; }
.drawer .what .icon { color: var(--accent); width: 18px; height: 18px; margin-top: 1px; }
.drawer dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 14px 0; font-size: 13px; }
.drawer dt { color: var(--muted); }
.drawer dd { margin: 0; }
.drawer .why { font-size: 14px; border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--panel-2); border-radius: 0 10px 10px 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* Plain pages behind the other tabs */
.page h1 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 26px; margin: 0 0 4px; }
.page .lede { color: var(--muted); margin: 0 0 18px; max-width: 780px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 16px 18px; }
.card h2 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h2 .icon { color: var(--accent); }
.item { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.item .txt { flex: 1; min-width: 0; }
.item small { display: block; color: var(--muted); font-size: 12px; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.w { background: var(--warn-soft); color: var(--warn); }
.pill.h { background: var(--hidden-soft); color: var(--hidden); }
.pill.live { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.big { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 46px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
.wide { grid-column: 1 / -1; }
.flag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; }
.empty-map { grid-column: 1 / -1; text-align: center; padding: 30px; color: var(--muted); }
.empty-map b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

@media (max-width: 1100px) {
  .map { grid-template-columns: 1fr; row-gap: 10px; }
  .map > * { grid-column: 1 !important; grid-row: auto !important; }
  .wires { display: none; }
  .col-head { display: none; }
  .hub { order: -1; }
  .below, .cards { grid-template-columns: 1fr; }
  .tabs span.lbl { display: none; }
  .legend { display: none; }
}

.drawer:not(.open) { box-shadow: none; visibility: hidden; }

.hub-bad { color: var(--bad); }

</style>
</head>

<header class="bar" id="bar"></header>
<main id="main" tabindex="-1"></main>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<script>

// Invented data for the dashboard mockups. No real conversation, path or person.
// Four scenarios: busy (the default), quiet, attention and firstrun.
// Times are minutes from the mockup clock, which starts at 13:41:00.

const MOCK = (() => {
  const loadedAt = Date.now();
  const startMinutes = 13 * 60 + 41;
  const minute = 60 * 1000;
  const base = loadedAt;

  const at = (minutesFromNow) => base + minutesFromNow * minute;
  const clockOf = (ms) => {
    const total = Math.floor((ms - base) / minute) + startMinutes;
    const h = Math.floor(((total % 1440) + 1440) % 1440 / 60);
    const m = ((total % 60) + 60) % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  };
  const nowClock = () => clockOf(Date.now() - loadedAt + base);
  const left = (ms) => {
    const seconds = Math.max(0, Math.ceil((ms - (Date.now() - loadedAt + base)) / 1000));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') : m + ':' + String(s).padStart(2, '0');
  };
  const size = (mb) => mb >= 1000 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';

  const install = {

    { key: 'codex', name: 'Codex', state: 'ok', short: 'Set up for all your projects',
      sentence: 'Every new Codex conversation can use BrowserAI, in any folder.',

  const changelog = {

        { icon: '\ud83d\udd27', head: 'The texts an agent and a person read say the same things in fewer words.', body: 'The tool list an agent is handed is about 2,200 characters shorter.' },
      ] },
      { name: 'Fixed', entries: [

        { icon: '\ud83d\udc1b', head: 'A Claude Code terminal session is told to reconnect through /mcp after an update.', body: 'The page and the notification name each terminal session that will need it.' },
      ] },

  };

  const placeLabel = (c) => c.place === 'VS Code' ? 'Claude Code in VS Code' : c.place === 'Terminal' ? 'Claude Code in a terminal' : 'Codex';

  function sessionNode(s) {
    return '<button class="node ' + cls(s) + '" type="button" data-open="s:' + s.id + '"><span class="br-ic ' + cls(s) + '">' + I.of(s.state === 'window' ? 'window' : s.state === 'hidden' ? 'hidden' : 'closed') + '</span><span class="txt"><b>' + esc(s.name) + '</b><small>' + esc(s.browser) + (s.kept ? ', kept' : '') + '</small><span class="state">' + stateText(s) + '</span></span></button>';
  }

  function conversationNode(c) {
    return '<button class="node" type="button" data-open="c:' + c.id + '">' + appIc(c.app) + '<span class="txt"><b>' + esc(c.title) + '</b><small>' + esc(placeLabel(c)) + ', ' + esc(c.folderName) + '</small></span>' + (c.running ? '<span class="tag live">Working</span>' : '') + '</button>';
  }

  function alerts() {
    let html = '';
    for (const a of M.attention) {
      html += '<div class="alert ' + a.level + '" role="alert">' + I.of(a.level === 'bad' ? 'bad' : 'warn') + '<p><b>' + esc(a.title) + '.</b> ' + esc(a.text) + '</p>'
        + (a.kind === 'broken' ? '<button class="btn" type="button" data-open="hub">How to reinstall</button>' : a.kind === 'app' ? '<a class="btn" href="#/setup">Repair</a>' : '<a class="btn" href="#/update">See the update</a>') + '</div>';
    }
    if (D.occasion === 'firstrun') {
      html += '<div class="alert good">' + I.of('checkCircle') + '<p><b>BrowserAI is installed.</b> Claude Code is set up for all your projects, and Codex was not found. When a conversation uses BrowserAI, it appears on this map with the browser it opens.</p><a class="btn" href="#/setup">See the setup</a></div>';
    }
    return html ? '<div class="alerts">' + html + '</div>' : '';
  }

  // ---- The map --------------------------------------------------------------------

  function map() {
    const rows = [];
    let lastWindow = null;
    for (const c of D.conversations) {
      const label = c.windowKey && c.windowKey !== lastWindow ? '<div class="group-label">' + I.of('code') + esc(c.windowLabel) + '</div>' : !c.windowKey ? '<div class="group-label">' + I.of(c.place === 'Terminal' ? 'terminal' : 'chat') + esc(c.place === 'Terminal' ? 'Terminal in ' + c.folderName : 'Codex app') + '</div>' : '';
      lastWindow = c.windowKey || null;
      rows.push({ key: c.id, left: '<div class="left-cell" data-row="' + c.id + '">' + label + conversationNode(c) + '</div>', right: c.sessions.length ? '<div class="right-cell" data-row="' + c.id + '">' + c.sessions.map((id) => sessionNode(M.sessionById(id))).join('') + '</div>' : '<div class="none-cell" data-row="' + c.id + '">No browser yet</div>' });
    }
    for (const s of D.sessions.filter((x) => x.kept)) {
      rows.push({ key: s.id, left: '<div class="ghost" data-row="' + s.id + '">Its conversation ended. BrowserAI keeps the session for the next one.</div>', right: '<div class="right-cell" data-row="' + s.id + '">' + sessionNode(s) + '</div>' });
    }

    const u = D.update;
    const hub = '<button class="hub" type="button" data-open="hub">' + I.brand('hub') + '<h2>BrowserAI ' + esc(D.version) + '</h2><p>' + (D.broken ? '<b class="hub-bad">Needs reinstalling</b>' : 'Running since ' + esc(D.since)) + '</p>'
      + '<div class="hub-stat"><div><span>Conversations</span><b>' + D.conversations.length + '</b></div><div><span>Open browsers</span><b>' + M.openBrowsers + '</b></div><div><span>On your screen</span><b>' + M.windows.length + '</b></div></div>'
      + (u.state === 'held' ? '<div class="upd"><b>Update ' + esc(u.version) + ' ready</b>' + (u.wait === 'counting' ? 'installs in ' + count(u.installsAt) + ' if nothing uses BrowserAI' : 'waits for a window to close') + '</div>' : '<div class="upd ok"><b>Up to date</b>checked at ' + esc(u.checked) + '</div>') + '</button>';

    let grid = '<div class="col-head">Conversations</div><div></div><div class="col-head">Where they run</div><div></div><div class="col-head right">Browser sessions</div>';
    if (rows.length === 0) {
      grid += '<div class="empty-map"><b>Nothing is connected</b>When an agent in Claude Code or Codex calls a BrowserAI tool, its conversation appears on the left, with a line to the browser it opens on the right.</div>';
      grid += hub.replace('class="hub"', 'class="hub" data-alone="1"');
    } else {
      grid += hub + rows.map((r, i) => r.left.replace('class="', 'data-i="' + i + '" class="') + r.right.replace('class="', 'data-i="' + i + '" class="')).join('');
    }

    const busy = D.conversations.length;
    const title = M.attention.length ? plural(M.attention.length, 'thing needs you', 'things need you') : busy ? plural(busy, 'conversation is', 'conversations are') + ' using ' + plural(M.openBrowsers, 'browser', 'browsers') : 'Nothing is using BrowserAI right now';
    const sub = busy ? 'Each line runs from a conversation in Claude Code or Codex, through BrowserAI, to the browser session it opened. Click anything to see what it is.' : 'BrowserAI is running and ready. This map fills in as soon as an agent uses it.';

    return '<div class="intro"><div><h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p></div><div class="legend"><span><i class="w"></i>Window on your screen</span><span><i class="h"></i>Hidden browser</span><span><i class="c"></i>No browser open</span><span><i class="k"></i>Kept, no conversation</span></div></div>'
      + alerts()
      + '<div class="map" id="map"><svg class="wires" id="wires" aria-hidden="true"></svg>' + grid + '</div>'
      + '<div class="below">'
      + '<a class="mini" href="#/update">' + I.of('update') + '<div><b>' + (u.state === 'held' ? 'Update ' + esc(u.version) + ' is ready' : 'Up to date') + '</b><span>' + (u.state === 'held' ? 'What holds it, and Install now' : 'Checked ' + esc(u.source) + ' at ' + esc(u.checked)) + '</span></div>' + I.of('chevron', 'chev') + '</a>'
      + '<a class="mini" href="#/setup">' + I.of('plug') + '<div><b>Claude Code and Codex</b><span>' + (D.apps.every((a) => a.state === 'ok') ? 'Both set up for all your projects' : D.apps.map((a) => esc(a.name) + ': ' + esc(a.short.toLowerCase())).join(', ')) + '</span></div>' + I.of('chevron', 'chev') + '</a>'
      + '<a class="mini" href="#/storage">' + I.of('disk') + '<div><b>' + M.size(M.totalMb) + ' on this PC</b><span>' + plural(M.folderCount, 'session folder', 'session folders') + ', browsers and logs</span></div>' + I.of('chevron', 'chev') + '</a>'
      + '</div>';
  }

  // Draws the wires once the cards have their places.
  function drawWires() {
    const svg = document.getElementById('wires');
    const mapEl = document.getElementById('map');
    const hubEl = mapEl && mapEl.querySelector('.hub');
    if (!svg || !hubEl || hubEl.dataset.alone) return;
    const box = mapEl.getBoundingClientRect();
    const hub = hubEl.getBoundingClientRect();
    const hx1 = hub.left - box.left;
    const hx2 = hub.right - box.left;
    let paths = '';
    const port = (x, y, k) => '<circle class="port ' + k + '" cx="' + x + '" cy="' + y + '" r="5"/>';
    const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2; };
    for (const left of mapEl.querySelectorAll('.left-cell, .ghost')) {
      const key = left.dataset.row;
      const conv = M.conversationById(key);
      const node = left.querySelector('.node') || left;
      const ln = node.getBoundingClientRect();
      const y = ln.top + ln.height / 2 - box.top;
      const right = mapEl.querySelector('.right-cell[data-row="' + key + '"]');
      const sessions = right ? [...right.querySelectorAll('.node')] : [];
      const first = conv && conv.sessions.length ? M.sessionById(conv.sessions[0]) : M.sessionById(key);
      const k = conv ? (first ? cls(first) : 'n') : 'k';
      const live = conv && conv.running ? ' live' : '';
      if (conv) {
        paths += '<path class="wire ' + k + live + '" d="' + curve(ln.right - box.left, y, hx1, y) + '"/>' + port(hx1, y, k);
      }
      for (const sn of sessions) {
        const r = sn.getBoundingClientRect();
        const ty = r.top + r.height / 2 - box.top;
        const s = M.sessionById(sn.dataset.open.slice(2));
        const sk = conv ? cls(s) : 'k';
        paths += '<path class="wire ' + sk + live + '" d="' + curve(hx2, y, r.left - box.left, ty) + '"/>' + port(hx2, y, sk);
      }
      if (!right && conv) {
        const none = mapEl.querySelector('.none-cell[data-row="' + key + '"]');
        if (none) {
          const r = none.getBoundingClientRect();
          paths += '<path class="wire c" d="' + curve(hx2, y, r.left - box.left - 6, y) + '"/>' + port(hx2, y, 'n');
        }
      }
    }
    svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
    svg.innerHTML = paths;
  }

  // ---- The inspector ------------------------------------------------------------------

  function inspect(what) {
    let html = '<button class="close" type="button" data-close aria-label="Close">x</button>';
    if (what === 'hub') {
      html += '<div class="kind">' + I.of('info') + 'BrowserAI</div><h2>BrowserAI ' + esc(D.version) + '</h2>'
        + '<div class="what">' + I.of('question') + '<div>BrowserAI runs in the background on this PC from sign-in to sign-out. Claude Code and Codex start it for each conversation, and it gives the agent a real browser.</div></div>'
        + '<dl><dt>Running since</dt><dd>' + esc(D.since) + ', started ' + esc(D.startedHow) + '</dd><dt>Installed in</dt><dd><code>' + esc(D.install.root) + '</code></dd><dt>Data</dt><dd><code>' + esc(D.install.data) + '</code></dd><dt>Updates</dt><dd>from ' + esc(D.update.source) + ', checked ' + esc(D.update.checked) + '</dd></dl>'
        + (D.broken ? '<div class="alert bad">' + I.of('bad') + '<p><b>Needs reinstalling.</b> Download BrowserAI.exe from the latest release and run it. It installs over this install and keeps every session.</p></div>' : '')
        + '<div class="btns"><button class="btn" type="button">' + I.of('folder') + 'Install folder</button><button class="btn" type="button">' + I.of('folder') + 'Data</button><button class="btn" type="button">' + I.of('file') + 'Logs</button></div>';
    } else if (what.startsWith('c:')) {
      const c = M.conversationById(what.slice(2));
      html += '<div class="kind">' + I.of('chat') + 'Conversation</div><h2>' + esc(c.title) + '</h2>'
        + '<div class="what">' + I.of('question') + '<div>A chat in ' + esc(c.app) + '. It is connected to BrowserAI while it is open, and it ends when ' + esc(c.app) + ' closes it, never from here.</div></div>'
        + '<dl><dt>App</dt><dd>' + esc(c.app + ' ' + c.version) + ', ' + esc(c.place === 'Codex' ? 'desktop app' : 'in ' + c.place) + '</dd><dt>Folder</dt><dd><code>' + esc(c.folder) + '</code></dd><dt>Connected</dt><dd>since ' + esc(c.since) + '</dd><dt>Now</dt><dd>' + (c.running ? 'A call is running.' : c.holdsUntil ? 'Called a few minutes ago.' : 'Idle.') + '</dd><dt>After an update</dt><dd>' + esc(M.reconnectText[c.reconnect]) + '</dd></dl>'
        + (c.sessions.length ? '<p>Its browser sessions:</p>' + c.sessions.map((id) => sessionNode(M.sessionById(id))).join('') : '<p class="lede">No browser yet.</p>');
    } else {
      const s = M.sessionById(what.slice(2));
      const c = s.by ? M.conversationById(s.by) : null;
      html += '<div class="kind">' + I.of('globe') + 'Browser session</div><h2>' + esc(s.name) + '</h2>'
        + '<div class="what">' + I.of('question') + '<div>A folder an agent made for its browser work: the browser profile with its logins and cookies, screenshots, downloads and a log. Only the agent that made it deletes it.</div></div>'
        + '<dl><dt>For</dt><dd>' + esc(s.purpose) + '</dd><dt>Browser</dt><dd>' + esc(s.browser) + ', ' + stateText(s) + '</dd><dt>Used by</dt><dd>' + (c ? esc(c.title) : 'nobody, its conversation ended') + '</dd><dt>Folder</dt><dd><code>' + esc(s.folder) + '</code></dd><dt>Size</dt><dd>' + M.size(s.mb) + (s.flags.length ? ', holds ' + s.flags.map(esc).join(', ') : '') + '</dd></dl>'
        + '<p class="kind">Latest call</p><p class="why">' + esc(s.lastWhy) + '</p>'
        + (s.state === 'window' ? '<div class="alert warn">' + I.of('window') + '<p>This window is on your screen. While it is open, it holds updates. Closing it ends the browser and keeps the session.</p></div>' : '')
        + '<div class="btns"><button class="btn" type="button">' + I.of('folder') + 'Open folder</button></div>';
    }
    drawer.innerHTML = html;
    drawer.classList.add('open');
    for (const n of main.querySelectorAll('[aria-pressed]')) n.setAttribute('aria-pressed', 'false');
    for (const n of main.querySelectorAll('[data-open="' + what + '"]')) n.setAttribute('aria-pressed', 'true');
    M.tick(drawer);
  }

  // ---- The other tabs -----------------------------------------------------------------

  function update() {
    const u = D.update;
    if (u.state !== 'held') {
      return '<div class="page"><h1>BrowserAI is up to date</h1><p class="lede">' + esc(D.version) + ' is the newest. BrowserAI checked ' + esc(u.source) + ' at ' + esc(u.checked) + '. A newer version is downloaded by itself and installed once nothing uses BrowserAI.</p></div>';
    }
    const it = (icon, t, sub, pill) => '<div class="item">' + I.of(icon) + '<div class="txt">' + t + '<small>' + sub + '</small></div>' + pill + '</div>';
    return '<div class="page"><h1>Update ' + esc(u.version) + ' is ready to install</h1><p class="lede">It installs by itself once nothing uses BrowserAI. On the map, every coloured line holds it.</p><div class="cards">'
      + '<div class="card"><h2>' + I.of('clock') + 'Installs by itself</h2>' + (u.wait === 'counting' ? '<div class="big">' + count(u.installsAt) + '</div><p class="lede">at about ' + M.clockOf(u.installsAt) + ', if nothing is used before then</p>' : '<p>Waits for a window set never to close by itself.</p>') + '<button class="btn danger" type="button">Install ' + esc(u.version) + ' now</button><p class="lede">Installing now closes every browser and ends every connection. Claude Code in VS Code reconnects by itself; in a terminal, run /mcp, choose BrowserAI, then Reconnect; Codex needs a new conversation.</p></div>'
      + '<div class="card"><h2>' + I.of('globe') + 'Browsers that hold it</h2>' + (M.windows.map((s) => it('window', esc(s.name), 'Close it to let the update go ahead', '<span class="pill w">' + (s.never ? 'never' : count(s.closes)) + '</span>')).join('') + M.hidden.map((s) => it('hidden', esc(s.name), s.kept ? 'Kept, no conversation' : 'Closes if no call uses it', '<span class="pill h">' + count(s.closes) + '</span>')).join('') || '<p class="lede">None.</p>') + '</div>'
      + '<div class="card"><h2>' + I.of('chat') + 'Conversations that hold it</h2>' + (D.conversations.map((c) => it(c.place === 'Terminal' ? 'terminal' : 'code', esc(c.title), esc(M.reconnectText[c.reconnect]), c.running ? '<span class="pill live">working</span>' : c.holdsUntil ? '<span class="pill">' + count(c.holdsUntil) + '</span>' : '<span class="pill">idle</span>')).join('') || '<p class="lede">None.</p>') + '</div>'
      + '</div></div>';
  }

  function setup() {
    return '<div class="page"><h1>Claude Code and Codex</h1><p class="lede">Your agents reach BrowserAI through these apps. Each is set up on its own, for all your projects or in one project folder.</p><div class="cards">'
      + D.apps.map((a) => '<div class="card"><h2>' + appIc(a.name) + esc(a.name) + '</h2><p><span class="pill ' + (a.state === 'ok' ? 'h' : a.state === 'repair' ? 'bad' : '') + '">' + esc(a.short) + '</span></p><p class="lede">' + esc(a.sentence) + '</p>'
        + (a.state === 'missing' ? '<button class="btn" type="button" disabled>Install ' + esc(a.name) + ' first</button>' : '<div class="btns">' + (a.state === 'repair' ? '<button class="btn primary" type="button">Repair</button>' : '<button class="btn" type="button">Set up again</button><button class="btn" type="button">Remove</button>') + '<button class="btn" type="button">In one project</button></div>') + '</div>').join('')
      + '<div class="card"><h2>' + I.of('info') + 'What setting up does</h2><p class="lede">It writes one entry, named browserai, into the app\'s own settings. The entry starts BrowserAI.exe with --mcp when a conversation begins. A conversation that was already open sees the change only after a restart.</p></div>'
      + '</div></div>';
  }

  function storage() {
    const all = D.sessions.map((s) => ({ name: s.name, mb: s.mb, used: s.running ? 'now' : s.lastAgo, flags: s.flags })).concat(D.onDisk.map((s) => ({ name: s.name, mb: s.mb, used: s.used, flags: s.flags }))).sort((x, y) => y.mb - x.mb);
    return '<div class="page"><h1>' + M.size(M.totalMb) + ' on this PC</h1><p class="lede">Session folders stay until the agent that made them deletes them. Browsers are downloaded once and shared.</p><div class="cards">'
      + '<div class="card wide"><h2>' + I.of('folder') + plural(M.folderCount, 'session folder', 'session folders') + ', ' + M.size(M.sessionsMb) + '</h2>' + (all.map((r) => '<div class="item">' + I.of('folder') + '<div class="txt">' + esc(r.name) + r.flags.map((f) => '<span class="flag">' + esc(f) + '</span>').join('') + '<small>last used ' + esc(r.used) + '</small></div><span class="pill">' + M.size(r.mb) + '</span><button class="btn" type="button">Open</button></div>').join('') || '<p class="lede">No session folder yet.</p>') + '</div>'
      + '</div></div>';
  }

  function whatsNew() {
    const c = D.changelog;
    return '<div class="page"><h1>What is new in ' + esc(c.version) + '</h1><p class="lede">Released ' + esc(c.date) + '.</p><div class="cards">' + c.groups.map((g) => '<div class="card"><h2>' + I.of('sparkle') + esc(g.name) + '</h2>' + g.entries.map((e) => '<div class="item"><span aria-hidden="true">' + e.icon + '</span><div class="txt">' + esc(e.head) + '<small>' + esc(e.body) + '</small></div></div>').join('') + '</div>').join('') + '</div></div>';
  }

  const tabs = [
    { key: '', label: 'Map', icon: 'map', view: map },
    { key: 'update', label: 'Update', icon: 'update', view: update, dot: () => D.update.state === 'held' },
    { key: 'setup', label: 'Claude Code and Codex', icon: 'plug', view: setup, dot: () => D.apps.some((a) => a.state === 'repair') },
    { key: 'storage', label: 'Storage', icon: 'disk', view: storage },
    { key: 'new', label: 'What is new', icon: 'sparkle', view: whatsNew },
  ];

  function render() {
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    const tab = tabs.find((t) => t.key === parts[0]) || tabs[0];
    main.innerHTML = tab.view();
    for (const a of document.querySelectorAll('.tabs a')) {
      if (a.dataset.key === tab.key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    drawer.classList.remove('open');
    M.tick(main);
    if (tab.key === '') {
      const mapEl = document.getElementById('map');
      const cells = [...mapEl.querySelectorAll('[data-i]')];
      const n = cells.reduce((m, el) => Math.max(m, Number(el.dataset.i) + 1), 0);
      for (const el of cells) el.style.gridRow = String(Number(el.dataset.i) + 2);
      const hubEl = mapEl.querySelector('.hub');
      if (hubEl) hubEl.style.gridRow = n ? '2 / span ' + n : '2';
      const empty = mapEl.querySelector('.empty-map');
      if (empty) empty.style.gridRow = '3';
      requestAnimationFrame(() => {
        drawWires();
        const pick = new URLSearchParams(location.search).get('inspect');
        if (pick) inspect(pick);
      });
    }
  }

  const led = M.attention.some((a) => a.level === 'bad') ? 'bad' : M.attention.length ? 'warn' : '';
  document.getElementById('bar').innerHTML = '<a class="logo" href="#/">' + I.brand('top') + 'BrowserAI</a><nav class="tabs" aria-label="Views">'
    + tabs.map((t) => '<a href="#/' + t.key + '" data-key="' + t.key + '">' + I.of(t.icon) + '<span class="lbl">' + esc(t.label) + '</span>' + (t.dot && t.dot() ? '<span class="dotn" aria-label="needs a look"></span>' : '') + '</a>').join('')
    + '</nav><span class="bar-gap"></span><span class="status"><span class="led ' + led + '"></span>' + esc(D.version) + (led ? ', needs you' : ', running') + '</span>';

  document.addEventListener('click', (e) => {
    const open = e.target.closest('[data-open]');
    if (open) { inspect(open.dataset.open); return; }
    if (e.target.closest('[data-close]')) { drawer.classList.remove('open'); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') drawer.classList.remove('open'); });
  window.addEventListener('resize', drawWires);
  window.addEventListener('hashchange', render);
  render();
  M.startTicking();
  M.mockControl();
})();

</script>
</body>
</html>
